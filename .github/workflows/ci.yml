name: CI

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "poetry"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Lint
        run: poetry run ruff check

      - name: Format check
        run: poetry run ruff format --check

      - name: Type check
        run: poetry run mypy register/

      - name: Test
        run: poetry run pytest --cov --cov-report=term-missing

      - name: Build
        run: poetry build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: register-dist
          path: dist/
          retention-days: 7
