[build-system]
requires = ["hatchling>=1.20.0"]
build-backend = "hatchling.build"

[project]
name = "register"
version = "0.1.0"
description = "Multi-dimensional data registry"
authors = [{name = "yehemin", email = "yehemin@example.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.10",
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["register"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
exclude = ["tests/"]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
