[tool.poetry]
name = "register"
version = "0.1.0"
description = "Multi-dimensional data registry"
authors = ["yehemin <yehemin@example.com>"]
readme = "README.md"
packages = [{include = "register"}]
include = ["register/py.typed"]

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.8"
mypy = "^1.10"
pytest-cov = "^7.1.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
exclude = ["tests/"]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
